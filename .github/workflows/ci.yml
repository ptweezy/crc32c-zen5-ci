name: ci

on:
  push:
  workflow_dispatch:

jobs:
  # Build the kernel's CRC library with the patch, with every compiler that
  # both this kernel and Ubuntu 24.04 support, and run the userspace test where
  # the runner's CPU allows.
  build:
    name: ${{ matrix.cc }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The kernel's minimum clang is 17.0.1.
        cc: [gcc-9, gcc-10, gcc-11, gcc-12, gcc-13, gcc-14,
             clang-17, clang-18, clang-19]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q "$CC" flex bison bc libelf-dev libssl-dev

      - name: Machine
        run: ./tools/machine.sh

      - name: Fetch kernel and apply patches
        run: ./tools/fetch-kernel.sh

      - name: Kernel lib/crc, x86_64, W=1
        run: |
          cd linux
          make CC="$CC" O=../b64 defconfig > /dev/null
          grep -E '^CONFIG_(CRC32|CRC32_ARCH|WERROR|CC_VERSION_TEXT|AS_IS_LLVM|AS_IS_GNU)=' ../b64/.config
          set -o pipefail
          make CC="$CC" O=../b64 -j"$(nproc)" W=1 lib/crc/ 2>&1 | tee ../b64.log
          test -f ../b64/lib/crc/x86/crc32c-mixed.o
          if grep -E 'warning' ../b64.log | grep -E 'lib/crc'; then
            echo "::error::warnings in lib/crc"; exit 1
          fi

      - name: Kernel lib/crc, i386, W=1
        run: |
          cd linux
          make ARCH=i386 CC="$CC" O=../b32 defconfig > /dev/null
          set -o pipefail
          make ARCH=i386 CC="$CC" O=../b32 -j"$(nproc)" W=1 lib/crc/ 2>&1 | tee ../b32.log
          test -f ../b32/lib/crc/crc32-main.o
          test ! -e ../b32/lib/crc/x86/crc32c-mixed.o
          if nm -u ../b32/lib/crc/crc32-main.o | grep -E 'crc32c_mixed|crc32c_x86_3way'; then
            echo "::error::dangling reference to a 64-bit-only routine"; exit 1
          fi
          if grep -E 'warning' ../b32.log | grep -E 'lib/crc'; then
            echo "::error::warnings in lib/crc"; exit 1
          fi

      - name: Userspace test
        run: |
          ./tools/have-avx512.sh || exit 0
          make KDIR="$PWD/linux" CC="$CC"
          python3 tools/verify-layout.py
          ./test 20000 | grep -E 'k-|references|all tests|SOME|FAIL'

  # Sample whatever CPUs the runners happen to have: correctness, and the
  # kernel's assembly against the kernel's existing code.
  bench:
    name: bench ${{ matrix.sample }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - name: Machine
        run: ./tools/machine.sh
      - name: Fetch kernel and apply patches
        run: ./tools/fetch-kernel.sh
      - name: Test and benchmark
        run: |
          ./tools/have-avx512.sh || exit 0
          make KDIR="$PWD/linux"
          ./test 20000 | grep -E 'k-|references|all tests|SOME|FAIL'
          F="-f k-3way -f k-today -f k-mixed"
          for run in 1 2; do
            ./bench $F -l 512 -l 1024 -l 2048 -l 4096 -l 16384 -r 512,4096,8 -r 3584,4096,8
            ./bench -i $F -l 512 -l 1024 -l 2048 -l 4096 -l 16384 -r 512,4096,8 -r 3584,4096,8
          done
